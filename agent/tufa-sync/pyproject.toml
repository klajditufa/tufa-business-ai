[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cis-client"
version = "2.0.0"
description = "Read sales, purchases, items, taxpayers and operators from the Albanian fiscalization system (CIS) with each business's own certificate."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "cryptography>=3.4",
    "lxml>=4.6",
    "certifi",
    "tzdata; sys_platform == 'win32'",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Accounting",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

[project.scripts]
cis-client = "cis_client.cli:main"

[tool.setuptools.packages.find]
include = ["cis_client*"]

[tool.setuptools.package-data]
cis_client = ["units.json", "web/*", "web/assets/*"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["schemas", "frontend", "cis_client/web"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001", # Albanian text legitimately contains characters like "ë"
    "RUF012", # class-level constants in tests
]
